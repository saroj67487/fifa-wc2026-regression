[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fifa-regression"
version = "1.0.0"
description = "Linear regression models for FIFA World Cup 2026 goal difference and goals scored"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Saroj Poudel" },
    { name = "Rajib Sadaula" },
    { name = "Raju Chaulagain" },
    { name = "Saad Mahmud Osmani" },
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
